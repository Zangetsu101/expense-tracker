name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      emulator:
        description: Build an x86_64 emulator test APK (always used outside main)
        type: boolean
        default: false
      signed_test:
        description: Build a signed ARM64 test APK as a workflow artifact, with no release (any branch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.signed_test || (github.ref == 'refs/heads/main' && !inputs.emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      checks: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The release notes need the full history and the tags to find the last release tag.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release version
        if: ${{ !inputs.signed_test }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { readRelease } from './scripts/release-version.mjs';
          const { version } = readRelease({
            appJson: readFileSync('app.json', 'utf8'),
            packageJson: readFileSync('package.json', 'utf8'),
          });
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_TAG=v${version}\n`);
          JS
      - name: Reject an existing release or tag
        if: ${{ !inputs.signed_test }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags"
          if grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/release-tags"; then
            echo '::error::A release already exists for this version. Bump the version before releasing again.'
            exit 1
          fi
          git ls-remote --tags origin "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/matching-tags"
          if [ -s "$RUNNER_TEMP/matching-tags" ]; then
            echo '::error::A tag already exists for this version. Bump the version before releasing again.'
            exit 1
          fi
      - name: Require a successful check job for the commit
        if: ${{ !inputs.signed_test }}
        run: |
          passed=$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA/check-runs?check_name=check&filter=latest" \
            --jq 'any(.check_runs[]; .conclusion == "success")')
          if [ "$passed" != true ]; then
            echo '::error::The commit has no successful check job. Wait for the checks to pass, then run the release again.'
            exit 1
          fi
      - uses: ./.github/actions/setup-android-build
      - name: Stamp the verified running release commit
        run: node scripts/stamp-release.mjs
      - name: Build signed ARM64 APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          EXPENSE_TRACKER_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          EXPENSE_TRACKER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPENSE_TRACKER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo '::error::Add the ANDROID_KEYSTORE_BASE64 repository secret before building.'
            exit 1
          fi
          umask 077
          export EXPENSE_TRACKER_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$EXPENSE_TRACKER_KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$EXPENSE_TRACKER_KEYSTORE"
          unset ANDROID_KEYSTORE_BASE64
          pnpm android:apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk
      - name: Upload signed test APK
        if: ${{ inputs.signed_test }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: expense-tracker-arm64-signed-test-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # A signed test run writes the same notes to the step summary as a dry run.
      - name: Write the release notes
        env:
          SIGNED_TEST: ${{ inputs.signed_test }}
        run: |
          node scripts/release-notes.mjs dist/*-arm64.apk > "$RUNNER_TEMP/release-notes.md"
          if [ "$SIGNED_TEST" = true ]; then
            echo '## Release notes (dry run: this run creates no release)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Release notes of the draft release' >> "$GITHUB_STEP_SUMMARY"
          fi
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Create draft GitHub prerelease
        if: ${{ !inputs.signed_test }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.apk dist/*.sha256 \
            --target "$GITHUB_SHA" --title "Expense Tracker ${RELEASE_TAG#v}" \
            --draft --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"

  emulator:
    if: ${{ !inputs.signed_test && (github.ref != 'refs/heads/main' || inputs.emulator) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPENSE_TRACKER_BUILD_TARGET: emulator
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-android-build
      - name: Stamp the verified running release commit
        run: node scripts/stamp-release.mjs
      - name: Build isolated x86_64 APK with bundled JavaScript
        run: pnpm android:apk:emulator
      - name: Upload emulator APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: expense-tracker-x86_64-emulator-${{ github.sha }}
          path: dist/*-x86_64-emulator.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

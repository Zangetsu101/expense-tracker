name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: Description of the tested JavaScript/asset changes
        required: true
        type: string

permissions:
  contents: read

# Concurrency is set on each job. A cancel-in-progress group on the workflow
# would also cancel a publish job that is in progress.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # An OTA update reaches only an APK with the same runtime version (ADR 0008).
      - name: Print the Android runtime version
        run: node scripts/runtime-version.mjs
      - name: Typecheck, lint, formatting, tests, and backup fixtures
        run: pnpm check

  publish:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ota-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add the EXPO_TOKEN repository secret before publishing.'
            exit 1
          fi
      - uses: expo/expo-github-action@9.0.1
        with:
          eas-version: '27.4.1'
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Stamp the verified running release commit
        run: node scripts/stamp-release.mjs
      - name: Print the Android runtime version
        id: runtime
        run: node scripts/runtime-version.mjs
      - name: Publish Android production update
        env:
          UPDATE_MESSAGE: ${{ inputs.message || 'Automatic update from main' }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.runtime-version }}
        run: >-
          eas update --channel production --platform android
          --environment production --non-interactive --json
          --message "$UPDATE_MESSAGE ($GITHUB_SHA, runtime $RUNTIME_VERSION)"
          > "$RUNNER_TEMP/updates.json"
      # eas update resolves the runtime version again with the EAS environment
      # variables. This step fails when that value is different.
      - name: Check the runtime version of the published update
        run: node scripts/runtime-version.mjs --check-published "$RUNNER_TEMP/updates.json"

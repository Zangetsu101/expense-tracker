name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      message:
        description: Description of the tested JavaScript/asset changes
        required: true
        type: string

permissions:
  contents: read

# The concurrency groups are on the jobs, not on the workflow.
# A new run cancels a check that is in progress for the same event and ref.
# A publish is never cancelled. The ota-production group runs one publish at a time.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: checks-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, formatting, tests, and backup fixtures
        run: pnpm check

  publish:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ota-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Expo credentials
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add the EXPO_TOKEN repository secret before publishing.'
            exit 1
          fi
      - uses: expo/expo-github-action@9.0.1
        with:
          eas-version: '27.4.1'
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Stamp the verified running release commit
        run: node scripts/stamp-release.mjs
      - name: Publish Android production update
        env:
          UPDATE_MESSAGE: ${{ inputs.message || 'Automatic update from main' }}
        run: >-
          eas update --channel production --platform android
          --environment production --non-interactive
          --message "$UPDATE_MESSAGE ($GITHUB_SHA)"
